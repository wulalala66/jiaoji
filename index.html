<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f4f1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="胶记：比重计算、配料单、产品条件表，胶粘剂实验室的随身工具。"
    />
    <!--
      内容安全策略：
        · 脚本只允许本文件来源，页面里没有任何内联 script / eval；
        · connect-src 必须是 * —— AI 接口地址是用户自己填的，事先无法枚举；
        · 其余一律收紧，防止被塞 iframe、被改 base、被提交表单到别处。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src *; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="胶记" />
    <title>胶记 · 胶粘剂实验室工具</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="ambient-orb ambient-orb-a"></span>
      <span class="ambient-orb-b"></span>
    </div>

    <main id="view" class="view" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" aria-label="主导航"></nav>

    <div id="toasts" aria-live="polite"></div>

    <noscript>
      <p style="padding: 24px; font-family: sans-serif">胶记需要 JavaScript 才能计算和保存数据，请在浏览器设置里打开。</p>
    </noscript>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
